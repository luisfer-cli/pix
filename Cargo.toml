[package]
name = "pix"
version = "0.1.0"
edition = "2024"
description = "Deterministic pixel-art DSL renderer with GIF and spritesheet export"
license = "MIT"
repository = "https://github.com/luisfer-cli/pix"
readme = "README.md"
keywords = ["pixel-art", "dsl", "spritesheet", "animation", "png"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
